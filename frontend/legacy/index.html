<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планировщик маршрутов выездных инженеров</title>
<link rel="stylesheet" href="/styles.css">
<script>
  // Применяем сохранённую тему до первой отрисовки, иначе страница мигает
  // ночной палитрой, прежде чем загрузится app.js.
  (function () {
    try {
      var mode = localStorage.getItem('dispatcher-theme');
      if (mode === 'light' || mode === 'dark') {
        document.documentElement.setAttribute('data-theme', mode);
      }
    } catch (e) { /* приватный режим — останется системная тема */ }
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <div>
      <div class="brand-title">Планировщик выездных работ</div>
      <div class="brand-sub">распределение заявок, маршруты и перепланирование дня</div>
    </div>
  </div>

  <div class="controls">
    <label class="field">
      <span>Район</span>
      <select id="region"></select>
    </label>
    <label class="field">
      <span>План</span>
      <select id="strategy" title="Как распределять заявки"></select>
    </label>
    <label class="field narrow">
      <span title="Сколько секунд планировщику искать лучший вариант">Расчёт, с</span>
      <input id="timeLimit" type="number" min="1" max="120" value="15"
             title="Сколько секунд планировщику искать лучший вариант. Больше времени — короче маршруты.">
    </label>
    <button id="btnPlan" class="primary">Спланировать</button>
    <button id="btnUndo" disabled title="Вернуть план к состоянию до последнего изменения">Шаг назад</button>

    <span class="controls-divider" aria-hidden="true"></span>

    <button id="btnCompare" title="Сравнить план с другими вариантами и с тем, как заявки разошлись на самом деле">Сравнить варианты</button>
    <button id="btnRisk" title="Где план порвётся первым, если работы затянутся">Прогноз опозданий</button>
    <button id="btnValidate" title="Перепроверить, что все ограничения соблюдены">Проверить план</button>

    <input id="fileInput" type="file" accept=".csv,.json,text/csv,application/json" hidden>
    <div class="menu">
      <button id="btnData" aria-haspopup="true" aria-expanded="false">Данные</button>
      <div class="menu-list" id="dataMenu" hidden>
        <button id="btnUpload">Загрузить набор…</button>
        <button id="btnDataset">Скачать набор заявок</button>
        <button id="btnExport">Выгрузить готовый план</button>
        <span class="menu-sep" aria-hidden="true"></span>
        <button id="btnSave">Сохранить рабочий день</button>
        <button id="btnRestore">Восстановить сохранённый</button>
        <button id="btnReset">Сбросить ручные правки</button>
      </div>
    </div>

    <div class="theme-switch" role="group" aria-label="Оформление">
      <button type="button" class="theme-btn" data-mode="system" aria-pressed="true">Система</button>
      <button type="button" class="theme-btn" data-mode="light" aria-pressed="false">День</button>
      <button type="button" class="theme-btn" data-mode="dark" aria-pressed="false">Ночь</button>
    </div>
  </div>
</header>

<section id="metrics" class="metrics" hidden></section>
<section id="planNotes" class="plan-notes" hidden></section>

<main class="layout">
  <aside class="panel left">
    <nav class="tabs">
      <button class="tab active" data-tab="routes">Маршруты</button>
      <button class="tab" data-tab="unassigned">Не назначены <em id="unassignedCount">0</em></button>
      <button class="tab" data-tab="assumptions">Как считаем</button>
    </nav>
    <div class="tab-body" id="tab-routes"></div>
    <div class="tab-body" id="tab-unassigned" hidden></div>
    <div class="tab-body" id="tab-assumptions" hidden></div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div id="mapLegend" class="legend" hidden></div>
    <div id="mapSource" class="map-source"></div>
    <div id="mapHint" class="map-hint">Выберите район и нажмите «Спланировать»</div>
  </div>

  <aside class="panel right" id="detail">
    <div class="empty">
      <h3>Объяснение назначения</h3>
      <p>Выберите заявку на карте или в списке маршрутов.</p>
    </div>
  </aside>
</main>

<details class="replan" id="replanBar">
  <summary class="replan-head">
    <strong>Событие в течение дня</strong>
    <span class="hint">срочная заявка, отмена, задержка или бригада выбыла</span>
  </summary>
  <div class="replan-controls">
    <label class="field">
      <span>Тип события</span>
      <select id="eventKind"></select>
    </label>
    <label class="field narrow">
      <span>Время</span>
      <input id="eventAt" type="time" value="13:00">
    </label>
    <label class="field" id="fieldOrder" hidden>
      <span>Заявка</span>
      <select id="eventOrder"></select>
    </label>
    <label class="field" id="fieldEngineer" hidden>
      <span>Исполнитель</span>
      <select id="eventEngineer"></select>
    </label>
    <label class="field narrow" id="fieldDelay" hidden>
      <span title="На сколько минут бригада сдвигается по всему остатку маршрута">Задержка, мин</span>
      <input id="eventDelay" type="number" value="45" min="5" max="480">
    </label>
    <label class="field">
      <span>Как перестраивать</span>
      <select id="eventMode"></select>
    </label>
    <button id="btnFromDataset" hidden title="Подставить событие, пришедшее вместе с набором данных">Взять из набора</button>
    <button id="btnReplan" class="primary">Перестроить</button>
  </div>
  <p class="replan-note" id="modeHint"></p>

  <div class="urgent-form" id="urgentForm" hidden>
    <label class="field narrow"><span>Номер</span><input id="uId" value="URGENT-1"></label>
    <label class="field"><span>Район</span><select id="uDistrict"></select></label>
    <label class="field"><span>Адрес</span><input id="uAddress" value="Точка выбрана на карте"></label>
    <label class="field narrow"><span>Окно с</span><input id="uFrom" type="time" value="14:00"></label>
    <label class="field narrow"><span>по</span><input id="uTo" type="time" value="16:00"></label>
    <label class="field narrow"><span title="Сколько минут займут работы">Работы, мин</span><input id="uDuration" type="number" value="90" min="5" max="480"></label>
    <label class="field"><span>Навык</span><select id="uSkill"></select></label>
    <label class="field"><span>Транспорт</span><select id="uVehicle"></select></label>
    <span class="pick-hint" id="pickHint">Укажите точку на карте</span>
  </div>
</details>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/map.js"></script>
<script src="/app.js"></script>
</body>
</html>
