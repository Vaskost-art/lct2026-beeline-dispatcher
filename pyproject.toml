[project]
name = "dispatcher"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Тесты репозиториев асинхронные: режим автоматический, чтобы не помечать
# каждый из них вручную.
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

# Модели Pydantic построены на Any внутри самой библиотеки: запрет явного Any
# срабатывает на объявлении класса, а не на нашем коде.
[[tool.mypy.overrides]]
module = "dispatcher.api.schemas"
disallow_any_explicit = false

# Словари, уходящие в JSON, описаны как `dict` там, где их форму задаёт
# получатель. Ядро (domain, infrastructure) проверяется без послаблений.
[[tool.mypy.overrides]]
module = ["dispatcher.services.*", "dispatcher.api.*"]
disallow_any_generics = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
