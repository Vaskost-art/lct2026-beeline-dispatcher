<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Планировщик выездных работ</title>
    <!-- Выбранная тема ставится до первой отрисовки: без этого страница
         мигала чужой палитрой, а «Как в системе» не следовало за системой. -->
    <script>
      try {
        var theme = localStorage.getItem('dispatcher-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {
        /* приватное окно: остаётся тема системы */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
