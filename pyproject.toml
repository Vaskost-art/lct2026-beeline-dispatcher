[project]
name = "dispatcher"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пока модули лежат в backend, после переезда остаётся только src.
pythonpath = ["backend", "src"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
