[project]
name = "dispatcher"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

# minimal: строгий режим уже выполняется ядром (domain, infrastructure) и
# проверяется командой `mypy src/dispatcher/domain src/dispatcher/infrastructure`.
# Слои services и api к нему приводятся вместе с разрезом ручек на схемы
# Pydantic: до этого момента словари, уходящие в JSON, описаны как `dict`.
[[tool.mypy.overrides]]
module = ["dispatcher.services.*", "dispatcher.api.*"]
disallow_any_generics = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
